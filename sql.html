<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Notes By ANI</title>
    <style>
        /* Basic reset and font setup */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Takes up the full height of the viewport */
        }

        /* Styling for the main heading */
        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        /* Container to space out the buttons */
        .button-group {
            display: flex;
            gap: 20px; /* Space between buttons */
        }

        /* Styling for the buttons */
        .note-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Hover effect for buttons */
        .note-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px); /* Slight lift effect */
        }
        
        /* Active (click) effect for buttons */
        .note-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>SQL Notes By ANI</h1>

    <div class="button-group">
	<button class="note-btn" onclick="window.location.href='sql_sublanguages_visualizer.html'">Languages</button>
        


    </div>

</body>
</html>
